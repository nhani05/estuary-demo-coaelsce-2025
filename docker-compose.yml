version: '3.8'

services:
  datagen:
    build: datagen
    container_name: mongodb-cloud-datagen
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-estuary_raw}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  transform:
    build: transform
    container_name: mongodb-cloud-transform
    restart: unless-stopped
    depends_on:
      - datagen
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-estuary_raw}
      MONGO_TRANSFORMED_DB_NAME: ${MONGO_TRANSFORMED_DB_NAME:-estuary_transformed}
      TRANSFORM_POLL_INTERVAL: ${TRANSFORM_POLL_INTERVAL:-10}

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  metabase-data: