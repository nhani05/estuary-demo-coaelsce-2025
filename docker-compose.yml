version: '3.8'

services:
  datagen:
    build: datagen
    container_name: mongodb-cloud-datagen
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-estuary_raw}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  transform:
    build: transform
    container_name: mongodb-cloud-transform
    restart: unless-stopped
    depends_on:
      - datagen
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-estuary_raw}
      MONGO_TRANSFORMED_DB_NAME: ${MONGO_TRANSFORMED_DB_NAME:-estuary_transformed}
      TRANSFORM_POLL_INTERVAL: ${TRANSFORM_POLL_INTERVAL:-10}